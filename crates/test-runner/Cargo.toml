[package]
name = "test-runner"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
nightly-harness = []

[dependencies]
criterion.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# for getting gpu temperature
macmon.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true, optional = true }
# Required (not optional): `ios_set_current_dir` in path.rs uses Foundation
# unconditionally on iOS, so iOS test/bench builds must link it.
objc2-foundation = { workspace = true }
